name: Release (SemVer tag + deploy)

# Cut an annotated vX.Y.Z tag from main and deploy it.
# Tag pushes created with GITHUB_TOKEN do not trigger other workflows
# (GitHub recursion guard), so verification + deploy run here directly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without v prefix (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version and main HEAD checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be MAJOR.MINOR.PATCH (pre-1.0: MAJOR=0)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists — tags are immutable, cut a new one"; exit 1
          fi
          # SemVer gate per AGENTS.md: tag only a state that passed the full CI gate.
          # Gate on the push-event go-ci run for this exact SHA. The check-runs API has no
          # check_suite.event field, so filtering check-runs by event never matches.
          sha=$(git rev-parse HEAD)
          echo "Checking CI for ${sha}"
          run=$(gh run list --workflow go-ci.yml --branch main --commit "$sha" \
                  --event push --limit 1 --json databaseId,status,conclusion \
                  --jq '.[0] // empty')
          [ -n "$run" ] || { echo "::error::no push CI run for ${sha} — merge CI must run before tagging"; exit 1; }
          case "$(echo "$run" | jq -r .status)" in
            completed) ;;
            *) echo "::error::CI still running: $run"; exit 1 ;;
          esac
          [ "$(echo "$run" | jq -r .conclusion)" = "success" ] \
            || { echo "::error::CI red: $run"; exit 1; }
          echo "CI green for ${sha}"

      - name: Create annotated SemVer tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "release v${VERSION}"
          git push origin "v${VERSION}"
          echo "Pushed tag v${VERSION}"
        env:
          VERSION: ${{ inputs.version }}

      - name: Deploy release to Render production
        uses: ./.github/actions/render-deploy
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: srv-db4ir7vavr4c73fdg45g
          base-url: https://paperviz-z4ne.onrender.com
          branch: main
