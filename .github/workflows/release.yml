name: Release (SemVer tag + deploy)

# Cut an annotated vX.Y.Z tag from main and deploy it.
# Tag pushes created with GITHUB_TOKEN do not trigger other workflows
# (GitHub recursion guard), so verification + deploy run here directly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without v prefix (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version and main HEAD checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be MAJOR.MINOR.PATCH (pre-1.0: MAJOR=0)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists — tags are immutable, cut a new one"; exit 1
          fi
          # SemVer gate per AGENTS.md: tag only a state that passed the full CI gate.
          # Filter to push-event suites so this dispatch run doesn't block itself.
          sha=$(git rev-parse HEAD)
          echo "Checking CI for ${sha}"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --paginate \
            --jq '[.check_runs[] | select(.check_suite.event == "push")] | length as $n |
                  (if $n == 0 then error("no push check-runs found") else . end),
                  (.[] | select(.status != "completed") | "CI still running: \(.name)" | halt_error),
                  (.[] | select((.conclusion // "") as $c |
                      ($c != "success") and ($c != "skipped") and ($c != "neutral")) |
                    "CI red: \(.name) → \(.conclusion)" | halt_error)' \
            || { echo "::error::main HEAD is not green — merge CI must pass before tagging"; exit 1; }
          echo "All checks green"

      - name: Create annotated SemVer tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "release v${VERSION}"
          git push origin "v${VERSION}"
          echo "Pushed tag v${VERSION}"
        env:
          VERSION: ${{ inputs.version }}

      - name: Deploy release to Render production
        uses: ./.github/actions/render-deploy
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: srv-db4ir7vavr4c73fdg45g
          base-url: https://paperviz-z4ne.onrender.com
          branch: main
