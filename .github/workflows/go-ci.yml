name: Go CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  build-backend-image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f build/Containerfile.backend -t paperviz-backend:${{ github.sha }} .

      - name: Save backend image
        run: docker save paperviz-backend:${{ github.sha }} | gzip > /tmp/paperviz-backend.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: paperviz-backend
          path: /tmp/paperviz-backend.tar.gz
          retention-days: 1

  build-frontend-image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -f build/Containerfile.frontend -t paperviz-frontend:${{ github.sha }} .

      - name: Save frontend image
        run: docker save paperviz-frontend:${{ github.sha }} | gzip > /tmp/paperviz-frontend.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: paperviz-frontend
          path: /tmp/paperviz-frontend.tar.gz
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: [build-backend-image, build-frontend-image]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Build frontend assets
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Start backend server
        env:
          GEMINI_API_KEY: test-key-not-real
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_REDIRECT_URL: http://localhost:8080/api/auth/google/callback
          STRIPE_SECRET_KEY: test-stripe-key
          STRIPE_WEBHOOK_SECRET: test-webhook-secret
          FRONTEND_URL: http://localhost:8080
          DATABASE_PATH: /tmp/paperviz-e2e.db
        run: |
          go run ./cmd/server &
          sleep 3
          curl -sf http://localhost:8080/healthz || (echo "Server failed to start" && exit 1)

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: e2e/playwright-results.json
          retention-days: 30
