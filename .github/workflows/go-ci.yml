name: Go CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The Go suite did not catch a server that could not boot: no test ran
      # the MCP tool-registration path. This drives the real stdio handshake.
      - name: MCP stdio handshake
        run: ./scripts/mcp-handshake-check.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Vite inlines VITE_* at build time. Without the key the bundle renders
      # "VITE_CLERK_PUBLISHABLE_KEY is not set" on every route, so build it with
      # the key and assert it landed in the bundle. The guard self-test proves
      # the assertion still rejects a keyless bundle (regression: keyless
      # landing page shipped once).
      - name: Build
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm run build
          ../scripts/frontend-bundle-check.sh dist
          ../scripts/frontend-bundle-guard-test.sh

  build-backend-image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f build/Containerfile.backend -t paperviz-backend:${{ github.sha }} .

      - name: Save backend image
        run: docker save paperviz-backend:${{ github.sha }} | gzip > /tmp/paperviz-backend.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: paperviz-backend
          path: /tmp/paperviz-backend.tar.gz
          retention-days: 1

  build-frontend-image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: >
          docker build -f build/Containerfile.frontend
          --build-arg VITE_CLERK_PUBLISHABLE_KEY="${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}"
          -t paperviz-frontend:${{ github.sha }} .

      - name: Save frontend image
        run: docker save paperviz-frontend:${{ github.sha }} | gzip > /tmp/paperviz-frontend.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: paperviz-frontend
          path: /tmp/paperviz-frontend.tar.gz
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: [build-backend-image, build-frontend-image]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Build frontend assets
        env:
          # Clerk publishable key is public (bundled client-side); e2e specs drive
          # real Clerk JS on login/signup pages.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          # The Go binary serves the API only, so the SPA must be told where the
          # API is. Vite inlines VITE_* at build time.
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          cd frontend
          npm ci
          npm run build
          ../scripts/frontend-bundle-check.sh dist

      - name: Start backend server
        env:
          GEMINI_API_KEY: test-key-not-real
          # main.go fails loud on these at boot; CI never authenticated against
          # real Clerk, so a non-empty dummy + fixed 32-byte base64 key suffices.
          CLERK_SECRET_KEY: sk_test_ci_dummy
          CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          FRONTEND_URL: http://localhost:4173
          # The SPA is served by `vite preview` on 4173 and calls the API
          # cross-origin, so that origin must be allowlisted.
          ALLOWED_ORIGINS: http://localhost:4173
          DATABASE_PATH: /tmp/paperviz-e2e.db
        run: |
          go run ./cmd/server &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz; then echo "server ready"; break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/healthz || (echo "Server failed to start" && exit 1)

      - name: Start frontend server
        run: |
          cd frontend
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4173/ >/dev/null; then echo "frontend ready"; break; fi
            sleep 2
          done
          curl -sf http://localhost:4173/ >/dev/null || (echo "Frontend failed to start" && exit 1)

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:4173
          API_URL: http://localhost:8080
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: e2e/playwright-results.json
          retention-days: 30

  # Only pushes to main or version tags reach prod; feature branches/PRs stop at CI.
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [go, frontend, e2e]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render production
        uses: ./.github/actions/render-deploy
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: srv-db4ir7vavr4c73fdg45g
          base-url: https://paperviz-z4ne.onrender.com
          branch: main
