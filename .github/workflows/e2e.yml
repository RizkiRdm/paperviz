name: E2E Tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend deps and build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Generate credential encryption key
        run: echo "CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Start backend server
        env:
          # The server refuses to boot without this. It encrypts stored BYOK
          # credentials, so it is required even though this run has no users.
          # There is deliberately no GEMINI_API_KEY / GOOGLE_* / STRIPE_* here:
          # PaperViz holds no model vendor account and those integrations were
          # removed on 2026-09-26.
          DATABASE_PATH: /tmp/paperviz-e2e-e2e-yml.db
          MIGRATIONS_DIR: migrations
          STATIC_DIR: frontend/dist
          PORT: 8080
        run: |
          go run ./cmd/server &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz; then echo "server ready"; break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/healthz || (echo "server failed" && exit 1)

      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-playwright-results
          path: e2e/playwright-results.json
          retention-days: 30
